[package]
name = "jumo_cli_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.3"
ratatui = "0.29.0"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"]}
crossterm = { version = "0.28.1", features = ["event-stream"] }
tokio-stream = "0.1.17"
edtui = "0.9.4"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
